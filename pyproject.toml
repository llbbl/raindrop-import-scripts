[tool.poetry]
name = "raindrop-import-scripts"
version = "0.1.0"
description = "A collection of import scripts for raindrop.io bookmark manager. Includes tools to convert Evernote (.enex) and Pocket (HTML export) files to CSV format for easy import into raindrop.io."
authors = ["llbbl <logan@llbbl.com>"]
readme = "README.md"
packages = [{include = "*"}]

[tool.poetry.dependencies]
python = "^3.11"
python-dateutil = "^2.9.0.post0"
lxml = "^6.1.0"
html2text = "^2025.4.15"
bs4 = "^0.0.2"
tqdm = "^4.67.1"
pyyaml = "^6.0.2"
requests = "^2.32.4"
python-dotenv = "^1.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-cov = "^6.1.1"
ruff = "^0.15.12"
ty = "^0.0.35"

[tool.poetry.scripts]
test = "pytest:main"
test-cov = "pytest:main"

[tool.pytest.ini_options]
addopts = "--cov=. --cov-report=xml --cov-report=term"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["__pycache__", ".venv", "coverage.xml"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
exclude = ["**/__pycache__", ".venv", "tests/**"]



[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
